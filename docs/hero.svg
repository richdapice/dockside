<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Dockside: tabs you leave fly into the side panel as apps, and a second tab from the same site turns the app into a folder</title>
  <style>
    .t { fill: #e6edf3; } .m { fill: #8b949e; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .anim { transform-box: fill-box; transform-origin: center; animation-duration: 12s; animation-iteration-count: infinite; }

    /* Base styles are the final frame, so reduced-motion viewers see the finished state. */
    .scene { animation-name: scene; }
    @keyframes scene { 0% {opacity:0} 3%,94% {opacity:1} 99%,100% {opacity:0} }

    /* The tab strip: each tab is active in turn, then leaves. */
    .tab1 { opacity:0; animation-name: tab1; } @keyframes tab1 { 0%,12% {opacity:1} 14%,100% {opacity:0} }
    .tab2 { opacity:0; animation-name: tab2; } @keyframes tab2 { 0%,32% {opacity:1} 34%,100% {opacity:0} }
    .tab3 { opacity:0; animation-name: tab3; } @keyframes tab3 { 0%,52% {opacity:1} 54%,100% {opacity:0} }
    .tab4 { transform: translateX(-246px); animation-name: tab4; } @keyframes tab4 { 0%,64% {transform:translateX(0)} 70%,100% {transform:translateX(-246px)} }
    .bg2 { fill:#161b22; animation-name: bg2; } @keyframes bg2 { 0%,11.5% {fill:#010409} 12.5%,100% {fill:#161b22} }
    .bg3 { fill:#161b22; animation-name: bg3; } @keyframes bg3 { 0%,31.5% {fill:#010409} 32.5%,100% {fill:#161b22} }
    .bg4 { fill:#161b22; animation-name: bg4; } @keyframes bg4 { 0%,51.5% {fill:#010409} 52.5%,100% {fill:#161b22} }
    .chip { opacity:1; transform-origin: left center; animation-name: chip; } @keyframes chip { 0%,64% {opacity:0; transform:scaleX(.2)} 68%,100% {opacity:1; transform:scaleX(1)} }

    /* The page under the active tab. */
    .p1 { opacity:0; animation-name: p1; } @keyframes p1 { 0%,12% {opacity:1} 13%,100% {opacity:0} }
    .p2 { opacity:0; animation-name: p2; } @keyframes p2 { 0%,12% {opacity:0} 13%,32% {opacity:1} 33%,100% {opacity:0} }
    .p3 { opacity:0; animation-name: p3; } @keyframes p3 { 0%,32% {opacity:0} 33%,52% {opacity:1} 53%,100% {opacity:0} }
    .p4 { opacity:1; animation-name: p4; } @keyframes p4 { 0%,52% {opacity:0} 53%,100% {opacity:1} }

    /* A copy of the leaving tab flies into the dock and shrinks into its icon. */
    .fly1 { opacity:0; animation-name: fly1; } @keyframes fly1 { 0%,12% {opacity:0; transform:translate(0,0) scale(1)} 13% {opacity:1; transform:translate(0,0) scale(1)} 20% {opacity:1; transform:translate(500px,69px) scale(.45)} 22%,100% {opacity:0; transform:translate(500px,69px) scale(.45)} }
    .fly2 { opacity:0; animation-name: fly2; } @keyframes fly2 { 0%,32% {opacity:0; transform:translate(0,0) scale(1)} 33% {opacity:1; transform:translate(0,0) scale(1)} 40% {opacity:1; transform:translate(476px,69px) scale(.45)} 42%,100% {opacity:0; transform:translate(476px,69px) scale(.45)} }
    .fly3 { opacity:0; animation-name: fly3; } @keyframes fly3 { 0%,52% {opacity:0; transform:translate(0,0) scale(1)} 53% {opacity:1; transform:translate(0,0) scale(1)} 60% {opacity:1; transform:translate(276px,69px) scale(.45)} 62%,100% {opacity:0; transform:translate(276px,69px) scale(.45)} }

    /* The dock: apps pop in, and the first one becomes a folder when its second tab lands. */
    .app1 { animation-name: app1; } @keyframes app1 { 0%,19% {opacity:0; transform:scale(.3)} 21% {opacity:1; transform:scale(1.12)} 23%,100% {opacity:1; transform:scale(1)} }
    .app2 { animation-name: app2; } @keyframes app2 { 0%,39% {opacity:0; transform:scale(.3)} 41% {opacity:1; transform:scale(1.12)} 43%,100% {opacity:1; transform:scale(1)} }
    .folder { fill:#21262d; animation-name: folder; } @keyframes folder { 0%,59% {fill:#161b22} 60%,100% {fill:#21262d} }
    .badge { animation-name: badge; } @keyframes badge { 0%,59% {opacity:0; transform:scale(.2)} 61% {opacity:1; transform:scale(1.3)} 63%,100% {opacity:1; transform:scale(1)} }
    .bump { animation-name: bump; } @keyframes bump { 0%,59% {transform:scale(1)} 61% {transform:scale(1.1)} 63%,100% {transform:scale(1)} }

    /* Captions under the scene. */
    .c1 { opacity:0; animation-name: c1; } @keyframes c1 { 0%,12% {opacity:0} 14%,48% {opacity:1} 50%,100% {opacity:0} }
    .c2 { opacity:0; animation-name: c2; } @keyframes c2 { 0%,52% {opacity:0} 54%,66% {opacity:1} 68%,100% {opacity:0} }
    .c3 { opacity:1; animation-name: c3; } @keyframes c3 { 0%,68% {opacity:0} 70%,100% {opacity:1} }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="959" height="339" rx="14" fill="#0d1117" stroke="#30363d"/>

  <g class="anim scene">
    <!-- browser window -->
    <rect x="32" y="28" width="568" height="262" rx="10" fill="#010409" stroke="#30363d"/>
    <circle cx="52" cy="49" r="5" fill="#30363d"/><circle cx="68" cy="49" r="5" fill="#30363d"/><circle cx="84" cy="49" r="5" fill="#30363d"/>

    <!-- pinned home tab -->
    <rect x="100" y="36" width="30" height="26" rx="7" fill="#010409" stroke="#30363d"/>
    <path d="M108 50 l7 -6 l7 6 v6 h-14 z" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Docked group chip, appears where the left tabs were -->
    <g class="anim chip">
      <rect x="134" y="36" width="54" height="26" rx="8" fill="#21262d" stroke="#484f58"/>
      <circle cx="148" cy="49" r="4" fill="#8b949e"/>
      <text x="158" y="53" font-size="11.5" class="t" font-weight="600">⚓ 3</text>
    </g>

    <!-- tabs -->
    <g class="anim tab1">
      <rect x="134" y="36" width="108" height="26" rx="7" fill="#161b22" stroke="#30363d"/>
      <circle cx="148" cy="49" r="6" fill="#8957e5"/>
      <text x="160" y="53" font-size="11.5" class="t">Pull #212</text>
    </g>
    <g class="anim tab2">
      <rect class="anim bg2" x="246" y="36" width="108" height="26" rx="7" stroke="#30363d"/>
      <circle cx="260" cy="49" r="6" fill="#5e6ad2"/>
      <text x="272" y="53" font-size="11.5" class="t">Roadmap</text>
    </g>
    <g class="anim tab3">
      <rect class="anim bg3" x="358" y="36" width="108" height="26" rx="7" stroke="#30363d"/>
      <circle cx="372" cy="49" r="6" fill="#8957e5"/>
      <text x="384" y="53" font-size="11.5" class="t">Issue #87</text>
    </g>
    <g class="anim tab4">
      <rect class="anim bg4" x="470" y="36" width="108" height="26" rx="7" stroke="#30363d"/>
      <circle cx="484" cy="49" r="6" fill="#d29922"/>
      <text x="496" y="53" font-size="11.5" class="t">Morning brief</text>
    </g>

    <!-- address bar + page, one layer per active tab -->
    <rect x="48" y="72" width="536" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
    <g class="anim p1"><text x="64" y="87" font-size="11" class="m mono">github.com/acme/app/pull/212</text><rect x="64" y="114" width="220" height="14" rx="4" fill="#8957e5" opacity=".8"/></g>
    <g class="anim p2"><text x="64" y="87" font-size="11" class="m mono">linear.app/acme/roadmap</text><rect x="64" y="114" width="180" height="14" rx="4" fill="#5e6ad2" opacity=".8"/></g>
    <g class="anim p3"><text x="64" y="87" font-size="11" class="m mono">github.com/acme/app/issues/87</text><rect x="64" y="114" width="250" height="14" rx="4" fill="#8957e5" opacity=".8"/></g>
    <g class="anim p4"><text x="64" y="87" font-size="11" class="m mono">news.example.com/morning-brief</text><rect x="64" y="114" width="200" height="14" rx="4" fill="#d29922" opacity=".8"/></g>
    <rect x="64" y="142" width="480" height="8" rx="4" fill="#21262d"/>
    <rect x="64" y="160" width="440" height="8" rx="4" fill="#21262d"/>
    <rect x="64" y="178" width="460" height="8" rx="4" fill="#21262d"/>
    <rect x="64" y="196" width="300" height="8" rx="4" fill="#21262d"/>
    <rect x="64" y="224" width="470" height="8" rx="4" fill="#21262d"/>
    <rect x="64" y="242" width="390" height="8" rx="4" fill="#21262d"/>

    <!-- side panel -->
    <rect x="624" y="28" width="304" height="262" rx="10" fill="#010409" stroke="#30363d"/>
    <line x1="624" y1="248" x2="928" y2="248" stroke="#30363d"/>
    <text x="728" y="273" font-size="12" fill="#58a6ff" text-anchor="middle">Unload tabs</text>
    <text x="830" y="273" font-size="12" fill="#58a6ff" text-anchor="middle">Clear dock</text>

    <!-- github.com: app, then folder -->
    <g class="anim app1">
      <g class="anim bump">
        <rect class="anim folder" x="662" y="92" width="52" height="52" rx="14" stroke="#30363d"/>
        <circle cx="688" cy="118" r="11" fill="#8957e5"/>
      </g>
      <g class="anim badge">
        <circle cx="712" cy="94" r="10" fill="#58a6ff"/>
        <text x="712" y="98" font-size="11.5" fill="#fff" font-weight="700" text-anchor="middle">2</text>
      </g>
      <text x="688" y="164" font-size="11" class="t" text-anchor="middle">github.com</text>
    </g>
    <!-- linear.app -->
    <g class="anim app2">
      <rect x="750" y="92" width="52" height="52" rx="14" fill="#161b22" stroke="#30363d"/>
      <circle cx="776" cy="118" r="11" fill="#5e6ad2"/>
      <text x="776" y="164" font-size="11" class="t" text-anchor="middle">linear.app</text>
    </g>

    <!-- flying copies of leaving tabs -->
    <g class="anim fly1">
      <rect x="134" y="36" width="108" height="26" rx="7" fill="#161b22" stroke="#58a6ff"/>
      <circle cx="148" cy="49" r="6" fill="#8957e5"/>
      <text x="160" y="53" font-size="11.5" class="t">Pull #212</text>
    </g>
    <g class="anim fly2">
      <rect x="246" y="36" width="108" height="26" rx="7" fill="#161b22" stroke="#58a6ff"/>
      <circle cx="260" cy="49" r="6" fill="#5e6ad2"/>
      <text x="272" y="53" font-size="11.5" class="t">Roadmap</text>
    </g>
    <g class="anim fly3">
      <rect x="358" y="36" width="108" height="26" rx="7" fill="#161b22" stroke="#58a6ff"/>
      <circle cx="372" cy="49" r="6" fill="#8957e5"/>
      <text x="384" y="53" font-size="11.5" class="t">Issue #87</text>
    </g>

    <!-- captions -->
    <text class="anim c1" x="480" y="319" font-size="14" text-anchor="middle"><tspan class="t" font-weight="600">Leave a tab.</tspan><tspan class="m"> It docks as an app.</tspan></text>
    <text class="anim c2" x="480" y="319" font-size="14" text-anchor="middle"><tspan class="t" font-weight="600">Same site again?</tspan><tspan class="m"> The app becomes a folder.</tspan></text>
    <text class="anim c3" x="480" y="319" font-size="14" text-anchor="middle"><tspan class="t" font-weight="600">Nothing reloads.</tspan><tspan class="m"> Docked tabs wait, live, in one collapsed group.</tspan></text>
  </g>
</svg>
