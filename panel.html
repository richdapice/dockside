<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dockside</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header hidden>
    <button id="back" aria-label="Back">‹</button>
    <h1 id="heading"></h1>
    <button id="close-all">Close all</button>
  </header>
  <div id="masthead" hidden>
    <img src="icons/icon.svg" alt="" width="40" height="40">
    <h1>Dockside</h1>
    <p id="count"></p>
  </div>
  <main id="grid"></main>
  <main id="folder" hidden></main>
  <p id="empty" hidden>Tabs you switch away from will show up here.</p>
  <footer id="actions">
    <button id="cache-tabs" title="Dock every tab but the one you're on and close them all to free memory. They reopen from their address.">Dock all tabs</button>
    <button id="clear-dock">Clear dock</button>
    <div id="confirm" role="alertdialog" aria-labelledby="confirm-text" hidden>
      <span id="confirm-text"></span>
      <button id="confirm-cancel">Cancel</button>
      <button id="confirm-ok">Clear</button>
    </div>
    <button id="show-labels" aria-pressed="true" aria-label="Show site names" title="Show site names under the tiles">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="4" y="1.5" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path class="caption" d="M3 13.5h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </button>
    <button id="keep-open" aria-pressed="false" aria-label="Keep panel open" title="Keep panel open after opening a tab">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="3" y="7" width="10" height="7.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path class="shackle" d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </button>
  </footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
